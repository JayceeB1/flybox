name: One-shot MaleCNS v1 source lock audit

on:
  push:
    branches:
      - audit/malecns-v1-source-lock
    paths:
      - .github/workflows/malecns-v1-source-lock-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FlyBox
        run: python -m pip install -e .
      - name: Download official MaleCNS v1.0 sources and compute candidate locks
        run: >-
          python -m flybox.connectome.acquire malecns_v1
          --bootstrap-hashes
          --config-dir config
          --data-dir data
          --repo-root .
      - name: Validate source manifest
        run: python -m flybox.provenance.validate data/malecns_v1/source-manifest.json
      - name: Show lock candidate
        run: cat data/malecns_v1/bootstrap-lock-candidate.json
      - name: Upload lock evidence only
        uses: actions/upload-artifact@v4
        with:
          name: malecns-v1-source-lock-audit
          path: |
            data/malecns_v1/source-manifest.json
            data/malecns_v1/bootstrap-lock-candidate.json
          if-no-files-found: error
          retention-days: 14
