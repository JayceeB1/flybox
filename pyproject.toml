[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "flybox"
version = "0.0.0"
description = "Embodied MaleCNS experimentation platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "FlyBox contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
data = [
  "numpy>=2.0,<3",
  "pyarrow>=18,<26",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0.12",
  "numpy>=2.0,<3",
  "pyarrow>=18,<26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["flybox"]
